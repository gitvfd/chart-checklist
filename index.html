<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Pre-Publication Checklist</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f3f5;
  --border: #e4e6ea; --border-strong: #d6d9de;
  --text: #14161a; --text-2: #5c6270; --text-3: #9096a3;
  --accent: #2f5fe0; --accent-soft: #eaf0ff; --accent-strong: #1f47b8;
  --success: #0e8f5f; --success-soft: #e7f8f0;
  --banner-bg: #101d40;
  --radius-lg: 14px; --radius-md: 10px; --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(20,25,35,.04), 0 2px 8px rgba(20,25,35,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216; --surface: #191c22; --surface-2: #1f232b;
    --border: #2b2f38; --border-strong: #3a3f4a;
    --text: #eef0f3; --text-2: #a2a8b5; --text-3: #6d7382;
    --accent: #6a8fff; --accent-soft: #1c2740; --accent-strong: #8aa5ff;
    --success: #3ecf8e; --success-soft: #10281f;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 2px 10px rgba(0,0,0,.3);
  }
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  font-size: 15px; line-height: 1.4;
}
.container { width: 100%; }

/* ── BANNER (full-bleed) ── */
.page-banner {
  width: 100vw; position: relative; left: 50%; transform: translateX(-50%);
  background: var(--banner-bg); color: #ffffff;
}
.page-banner-inner { max-width: 640px; margin: 0 auto; padding: 40px 18px 24px; }
.page-content { max-width: 640px; margin: 0 auto; padding: 22px 18px 60px; }

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── INTRO ── */
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.page-title { font-size: 21px; font-weight: 750; letter-spacing: -0.3px; margin-bottom: 6px; }
.page-sub { font-size: 13.5px; color: var(--text-2); margin-bottom: 26px; line-height: 1.55; max-width: 50ch; }

/* ── ROLE CARDS ── */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  padding: 17px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s;
  display: flex; align-items: flex-start; gap: 14px; text-align: left; width: 100%;
}
.card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card:active { transform: scale(.997); }
.card-icon {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: var(--accent-soft);
  color: var(--accent-strong); display: flex; align-items: center; justify-content: center;
}
.card-body { flex: 1; min-width: 0; }
.card-title { font-size: 14.5px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.card-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.5; margin-bottom: 6px; }
.card-meta { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.card-arrow { color: var(--text-3); flex-shrink: 0; margin-top: 10px; display: flex; }

/* ── TOP BAR (checklist screen) ── */
.back-btn {
  background: none; border: none; font-size: 12.5px; font-weight: 600; color: var(--text-3);
  cursor: pointer; padding: 4px 0; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 5px;
}
.back-btn:hover { color: var(--accent); }
.top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.top-bar h1 { font-size: 19px; font-weight: 750; letter-spacing: -0.3px; line-height: 1.25; }
.role-line { font-size: 12.5px; color: var(--text-2); margin-top: 5px; margin-bottom: 20px; }
.role-line b { color: var(--text); font-weight: 650; }
.restart-btn {
  flex-shrink: 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px;
  padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.restart-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── CHANNEL TOGGLE ── */
.field-label { font-size: 11.5px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.segmented {
  display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
  padding: 3px; margin-bottom: 22px; gap: 2px;
}
.segmented button {
  border: none; background: transparent; padding: 7px 15px; border-radius: 999px; font-size: 12.5px;
  font-weight: 650; color: var(--text-2); cursor: pointer; transition: background .15s, color .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.segmented button.active { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow); }
.channel-hint { font-size: 11.5px; color: var(--text-3); margin-top: -14px; margin-bottom: 22px; }

/* ── EXAMPLE ── */
.example-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px; }
.example-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
.example-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.example-link { font-size: 12px; font-weight: 650; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.example-link:hover { text-decoration: underline; }
.example-media { background: var(--surface-2); display: flex; align-items: center; justify-content: center; padding: 16px; }
.example-media img { display: block; max-height: 320px; width: auto; max-width: 100%; border-radius: 8px; box-shadow: var(--shadow); }
.example-media iframe { width: 100%; height: 340px; border: 0; display: block; border-radius: 8px; background: var(--surface); }

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 20px; }
.progress-bg { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 6px; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .25s ease; width: 0%; }
.progress-label { font-size: 11.5px; color: var(--text-3); text-align: right; font-weight: 600; }
.done-banner {
  display: none; background: var(--success-soft); border: 1.5px solid var(--success); border-radius: var(--radius-md);
  padding: 12px 16px; text-align: center; font-size: 13.5px; font-weight: 700; color: var(--success); margin-bottom: 18px;
  align-items: center; justify-content: center; gap: 8px;
}
.done-banner.visible { display: flex; }

/* ── SECTIONS (accordion) ── */
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 9px; overflow: hidden; }
.section-header { display: flex; align-items: center; gap: 11px; padding: 13px 15px; cursor: pointer; user-select: none; }
.section-header:hover { background: var(--surface-2); }
.section-icon {
  width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-strong); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.section-title { font-size: 13px; font-weight: 700; flex: 1; }
.section-count { font-size: 11px; color: var(--text-3); font-weight: 650; }
.chev { color: var(--text-3); margin-left: 2px; transition: transform .18s; display: inline-flex; }
.chev.open { transform: rotate(90deg); }
.items { display: none; padding: 2px 0 8px; border-top: 1px solid var(--border); }
.items.open { display: block; }

/* ── ITEMS ── */
.item { display: flex; align-items: flex-start; gap: 11px; padding: 10px 15px; cursor: pointer; border-radius: 8px; margin: 1px 6px; transition: background .1s; }
.item:hover { background: var(--surface-2); }
.item.checked .item-text { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.item.checked .item-note { color: var(--text-3); opacity: .6; }
.checkmark {
  width: 19px; height: 19px; flex-shrink: 0; margin-top: 1px; border: 1.5px solid var(--border-strong);
  border-radius: 5px; display: flex; align-items: center; justify-content: center; color: white;
  transition: background .12s, border-color .12s;
}
.checkmark svg { opacity: 0; transition: opacity .1s; }
.item.checked .checkmark { background: var(--accent); border-color: var(--accent); }
.item.checked .checkmark svg { opacity: 1; }
.item-text { font-size: 13.2px; line-height: 1.5; color: var(--text); flex: 1; }
.item-note { font-size: 11.5px; color: var(--text-3); display: block; margin-top: 3px; line-height: 1.45; }

/* flat list (quick-check role) */
.flat-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 4px 0; margin-bottom: 9px; }
.flat-list .item { margin: 1px 6px; }
.flat-list .item + .item { border-top: 1px solid var(--border); border-radius: 0; margin-top: 0; }
.flat-list .item:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }

/* ── locked/tool-handled disclosure ── */
.locked-wrap { border-top: 1px solid var(--border); }
.locked-summary {
  list-style: none; cursor: pointer; padding: 9px 15px; font-size: 11.5px; font-weight: 650;
  color: var(--text-3); display: flex; align-items: center; gap: 6px;
}
.locked-summary::-webkit-details-marker { display: none; }
.locked-summary:hover { color: var(--text-2); }
.locked-items { padding: 0 15px 10px 34px; }
.locked-item { font-size: 12px; color: var(--text-3); line-height: 1.6; }

.reset-btn {
  display: block; width: 100%; margin-top: 10px; padding: 11px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 12.5px; font-weight: 650;
  color: var(--text-2); cursor: pointer; text-align: center; transition: border-color .15s, color .15s;
}
.reset-btn:hover { border-color: #e0857a; color: #d1493a; }

/* ── BANNER — text/control colors on dark background ── */
.page-banner .eyebrow { color: #9db4ff; }
.page-banner .page-title { color: #ffffff; }
.page-banner .page-sub { color: rgba(255,255,255,.72); }
.page-banner .back-btn { color: rgba(255,255,255,.6); }
.page-banner .back-btn:hover { color: #ffffff; }
.page-banner .top-bar h1 { color: #ffffff; }
.page-banner .restart-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); color: rgba(255,255,255,.85); }
.page-banner .restart-btn:hover { border-color: #ffffff; color: #ffffff; }
.page-banner .role-line { color: rgba(255,255,255,.68); }
.page-banner .role-line b { color: #ffffff; }
.page-banner .field-label { color: rgba(255,255,255,.55); }
.page-banner .segmented { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
.page-banner .segmented button { color: rgba(255,255,255,.72); }
.page-banner .segmented button.active { background: #ffffff; color: var(--banner-bg); box-shadow: none; }
.page-banner .channel-hint { color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<div class="container">

<!-- ══ SCREEN 1: ROLE ══ -->
<div id="s1" class="screen active">
  <div class="page-banner">
    <div class="page-banner-inner">
      <div class="eyebrow">Chart checklist</div>
      <p class="page-title">Who's producing this chart?</p>
      <p class="page-sub">Pick your role — the checklist adjusts to what you're actually responsible for checking.</p>
    </div>
  </div>
  <div class="page-content">
    <div class="cards">
      <button class="card" onclick="selectRole('designer')">
        <div class="card-icon" data-icon="paintBrush" data-size="20"></div>
        <div class="card-body">
          <div class="card-title">Designer, building from scratch</div>
          <div class="card-desc">Working in Illustrator, Figma, or another free-form tool. Every design decision — layout, type, color, spacing — is yours to verify.</div>
          <div class="card-meta">Full checklist · 6 sections</div>
        </div>
        <div class="card-arrow" data-icon="arrowRight" data-size="16"></div>
      </button>
      <button class="card" onclick="selectRole('tool')">
        <div class="card-icon" data-icon="gearSix" data-size="20"></div>
        <div class="card-body">
          <div class="card-title">Chart producer, using the internal tool</div>
          <div class="card-desc">Chartbuilder, Flourish, or similar. The design system is enforced automatically — focus on the data and the message.</div>
          <div class="card-meta">Focused checklist · design steps handled for you</div>
        </div>
        <div class="card-arrow" data-icon="arrowRight" data-size="16"></div>
      </button>
      <button class="card" onclick="selectRole('social')">
        <div class="card-icon" data-icon="paperPlaneTilt" data-size="20"></div>
        <div class="card-body">
          <div class="card-title">Publishing a finished chart</div>
          <div class="card-desc">Social media or newsletter team, posting a chart someone else made. A short list of essentials before it goes live.</div>
          <div class="card-meta">Quick check · under a minute</div>
        </div>
        <div class="card-arrow" data-icon="arrowRight" data-size="16"></div>
      </button>
    </div>
  </div>
</div>

<!-- ══ SCREEN 2: CHECKLIST ══ -->
<div id="s2" class="screen">
  <div class="page-banner">
    <div class="page-banner-inner">
      <button class="back-btn" onclick="goTo('s1')"><span data-icon="arrowLeft" data-size="13"></span> Change role</button>
      <div class="top-bar">
        <h1 id="pageHeading">Pre-publication checklist</h1>
        <button class="restart-btn" onclick="resetAll()"><span data-icon="arrowCounterClockwise" data-size="13"></span> Reset</button>
      </div>
      <p class="role-line">Checklist for <b id="roleLine"></b></p>

      <div class="field-label">Where will it be published?</div>
      <div class="segmented" id="channelToggle">
        <button data-channel="web" onclick="setChannel('web')"><span data-icon="globe" data-size="14"></span> Web page</button>
        <button data-channel="social" onclick="setChannel('social')"><span data-icon="shareNetwork" data-size="14"></span> Social media</button>
        <button data-channel="newsletter" onclick="setChannel('newsletter')"><span data-icon="envelopeSimple" data-size="14"></span> Newsletter</button>
      </div>
      <p class="channel-hint" id="channelHint"></p>
    </div>
  </div>
  <div class="page-content">
    <div class="example-card">
      <div class="example-head">
        <span class="example-label">Example — <span id="exampleChannelLabel"></span></span>
        <a class="example-link" id="exampleLink" href="#" target="_blank" rel="noopener">View full example <span data-icon="arrowRight" data-size="12"></span></a>
      </div>
      <div class="example-media" id="exampleMedia"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0 checked</div>
    </div>
    <div class="done-banner" id="doneBanner"><span data-icon="checkCircle" data-size="16"></span> All checks passed — ready to publish</div>

    <div id="sectionsContainer"></div>
  </div>
</div>

</div><!-- /container -->

  size = size || 16;
  return `<svg class="ph" viewBox="0 0 256 256" width="${size}" height="${size}" fill="currentColor" aria-hidden="true"><path d="${ICON_PATHS[name]}"/></svg>`;
}

function initStaticIcons() {
  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = icon(el.dataset.icon, Number(el.dataset.size) || 16);
  });
}

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let selRole    = null;
let selChannel = 'web';
let checked    = new Set();
let activeIds  = [];

const roleLabels = {
  designer: "a designer building from scratch",
  tool:     "a chart producer using the internal tool",
  social:   "someone publishing a finished chart",
};
const roleHeadings = {
  designer: "Designer checklist",
  tool:     "Chart producer checklist",
  social:   "Quick publishing check",
};
const channelHints = {
  web:        "Embedded on a web page — branding comes from the surrounding page, no logo needed on the chart.",
  social:     "Standalone on social media — the chart needs its own logo/banner.",
  newsletter: "Embedded in a branded email template — no logo needed on the chart.",
};
const examples = {
  web:        { type:"iframe", src:"https://flo.uri.sh/visualisation/30016203/embed?auto=1", label:"Web page" },
  social:     { type:"image",  src:"best-practice-SM.png", label:"Social media" },
  newsletter: { type:"image",  src:"best-practice-NL.png", label:"Newsletter" },
};

function renderExample() {
  const ex = examples[selChannel];
  document.getElementById('exampleChannelLabel').textContent = ex.label;
  document.getElementById('exampleLink').href = ex.src;
  document.getElementById('exampleMedia').innerHTML = ex.type === 'iframe'
    ? `<iframe src="${ex.src}" loading="lazy" title="Example chart — ${ex.label}"></iframe>`
    : `<img src="${ex.src}" alt="Example best-practice chart for ${ex.label}" loading="lazy">`;
}

function itemApplies(item) {
  return item.roles.includes(selRole) && (!item.channels || item.channels.includes(selChannel));
}

function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function selectRole(role) {
  selRole = role;
  checked = new Set();
  document.getElementById('pageHeading').textContent = roleHeadings[role];
  document.getElementById('roleLine').textContent = roleLabels[role];
  document.querySelectorAll('#channelToggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.channel === selChannel));
  document.getElementById('channelHint').textContent = channelHints[selChannel];
  renderExample();
  build();
  goTo('s2');
}

function setChannel(channel) {
  selChannel = channel;
  document.querySelectorAll('#channelToggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.channel === channel));
  document.getElementById('channelHint').textContent = channelHints[channel];
  renderExample();
  build();
}

// ─────────────────────────────────────────
// BUILD
// ─────────────────────────────────────────
function build() {
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';
  activeIds = [];

  if (selRole === 'social') {
    buildFlatList(container);
  } else {
    sections.forEach((section, si) => buildSection(container, section, si));
  }
  updateProgress();
}

function buildFlatList(container) {
  const items = sections.flatMap(s => s.items).filter(itemApplies);
  if (items.length === 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'flat-list';
  items.forEach(item => wrap.appendChild(renderItem(item)));
  container.appendChild(wrap);
}

function buildSection(container, section, si) {
  const active = section.items.filter(itemApplies);
  const locked = (selRole === 'tool')
    ? section.items.filter(item => item.locked && !item.roles.includes('tool') && (!item.channels || item.channels.includes(selChannel)))
    : [];
  if (active.length === 0 && locked.length === 0) return;

  const secEl = document.createElement('div');
  secEl.className = 'section';

  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = `
    <div class="section-icon">${icon(section.icon, 15)}</div>
    <div class="section-title">${section.label}</div>
    <span class="section-count" id="cnt-${si}">0/${active.length}</span>
    <span class="chev open" id="chev-${si}">${icon('caretRight', 11)}</span>
  `;

  const itemsDiv = document.createElement('div');
  itemsDiv.className = 'items open';
  active.forEach(item => itemsDiv.appendChild(renderItem(item)));

  if (locked.length) {
    const details = document.createElement('details');
    details.className = 'locked-wrap';
    details.innerHTML = `<summary class="locked-summary">${icon('lockSimple', 12)} ${locked.length} item${locked.length > 1 ? 's' : ''} handled automatically by the tool</summary>`;
    const list = document.createElement('div');
    list.className = 'locked-items';
    locked.forEach(item => {
      const p = document.createElement('div');
      p.className = 'locked-item';
      p.textContent = item.text;
      list.appendChild(p);
    });
    details.appendChild(list);
    itemsDiv.appendChild(details);
  }

  header.onclick = () => {
    const open = itemsDiv.classList.toggle('open');
    header.querySelector(`#chev-${si}`).classList.toggle('open', open);
  };

  secEl.appendChild(header);
  secEl.appendChild(itemsDiv);
  container.appendChild(secEl);

  updateSectionCount(si, active.map(i => i.id));
}

function renderItem(item) {
  activeIds.push(item.id);
  const div = document.createElement('div');
  div.className = 'item' + (checked.has(item.id) ? ' checked' : '');
  div.id = `itm-${item.id}`;
  div.innerHTML = `
    <div class="checkmark">${icon('check', 12)}</div>
    <span class="item-text">${item.text}${item.note ? `<span class="item-note">${item.note}</span>` : ''}</span>
  `;
  div.onclick = () => toggleItem(item.id);
  return div;
}

// ─────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────
function toggleItem(id) {
  checked.has(id) ? checked.delete(id) : checked.add(id);
  document.getElementById(`itm-${id}`).classList.toggle('checked', checked.has(id));
  sections.forEach((section, si) => {
    const el = document.getElementById(`cnt-${si}`);
    if (!el) return;
    const ids = section.items.filter(itemApplies).map(i => i.id);
    updateSectionCount(si, ids);
  });
  updateProgress();
}

function updateSectionCount(si, ids) {
  const el = document.getElementById(`cnt-${si}`);
  if (!el) return;
  const done = ids.filter(id => checked.has(id)).length;
  el.textContent = `${done}/${ids.length}`;
}

function updateProgress() {
  const total = activeIds.length;
  const done  = activeIds.filter(id => checked.has(id)).length;
  const pct   = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total} checked`;
  document.getElementById('doneBanner').classList.toggle('visible', done === total && total > 0);
}

function resetAll() {
  checked = new Set();
  build();
}

initStaticIcons();
</script>
