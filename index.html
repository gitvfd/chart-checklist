<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Pre-Publication Checklist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f4f6fa;
    color: #1a1a2e;
    padding: 32px 20px;
    min-height: 100vh;
  }
  .container { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; color: #111827; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #6b7280; }

  .progress-wrap { margin-bottom: 28px; }
  .progress-bar-bg {
    background: #e5e7eb; border-radius: 99px; height: 10px; overflow: hidden; margin-bottom: 6px;
  }
  .progress-bar {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #3b82f6, #6366f1);
    transition: width 0.3s ease; width: 0%;
  }
  .progress-label { font-size: 12px; color: #6b7280; text-align: right; }

  .done-banner {
    display: none;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    border: 1.5px solid #6ee7b7;
    border-radius: 12px;
    padding: 14px 20px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #065f46;
    margin-bottom: 20px;
  }
  .done-banner.visible { display: block; }

  .section {
    background: white;
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.12s;
  }
  .section-header:hover { background: #f9fafb; }
  .section-header.open { border-bottom-color: #f0f0f0; }
  .section-icon {
    width: 34px; height: 34px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .section-title { font-size: 14px; font-weight: 700; flex: 1; color: #111827; }
  .section-count { font-size: 11px; color: #9ca3af; font-weight: 600; }
  .chevron { font-size: 10px; color: #9ca3af; margin-left: 6px; transition: transform 0.2s; display: inline-block; }
  .chevron.open { transform: rotate(90deg); }

  .items { display: none; padding: 8px 0; }
  .items.open { display: block; }

  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 9px 18px; cursor: pointer;
    border-radius: 8px; margin: 1px 8px;
    transition: background 0.1s;
  }
  .item:hover { background: #f9fafb; }

  .checkmark {
    width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #d1d5db; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-size: 12px; font-weight: 800; color: white;
  }
  .item.checked .checkmark { background: #3b82f6; border-color: #3b82f6; }
  .item.checked .checkmark::after { content: '✓'; }

  .item-text { font-size: 13px; line-height: 1.45; color: #374151; flex: 1; }
  .item.checked .item-text { color: #9ca3af; text-decoration: line-through; text-decoration-color: #d1d5db; }
  .item-note { font-size: 11px; color: #9ca3af; display: block; margin-top: 3px; font-style: italic; }
  .item.checked .item-note { color: #c4c4c4; }

  .reset-btn {
    display: block; width: 100%; margin-top: 8px;
    padding: 12px; background: white; border: 1.5px solid #e5e7eb;
    border-radius: 12px; font-size: 13px; font-weight: 600;
    color: #6b7280; cursor: pointer; text-align: center;
    transition: all 0.15s;
  }
  .reset-btn:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📊 Chart Pre-Publication Checklist</h1>
    <p class="subtitle">Complete all items before sharing on social media or in newsletters</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 items checked</div>
  </div>

  <div class="done-banner" id="doneBanner">🎉 All checks passed — ready to publish!</div>

  <div id="sections"></div>
  <button class="reset-btn" onclick="resetAll()">↺ Reset checklist</button>
</div>

<script>
const data = [
  {
    icon: "🎨", color: "#ede9fe", label: "Branding & Identity",
    items: [
      { text: "Official logo/banner is present and correctly positioned", note: "Refer to brand guidelines for the required placement zone" },
      { text: "Logo is not stretched, cropped, or resized below the minimum allowed size" },
      { text: "Only brand-approved colors are used — no off-palette shades", note: "Cross-check hex/rgb values against the design system" },
      { text: "No unauthorized fonts or font weights appear in the chart" }/*,
      { text: "Brand URL or tagline is included if required by communication guidelines" },µ*/
    ]
  },
  {
    icon: "🖋️", color: "#fef3c7", label: "Typography",
    items: [
      { text: "Title uses the correct typeface, weight, and size per OECD spec" },
      { text: "Subtitle or deck text is properly styled and distinct from body text" },
      { text: "Axis labels, legend text, and data labels use the approved font and minimum size" },
      { text: "No text falls below the minimum legible size at the final export dimensions", note: "Typically ≥ 10pt equivalent" },
      { text: "Capitalization style is consistent across all text elements", note: "e.g. sentence case throughout" },
      { text: "No orphan words or awkward line breaks in titles or callout annotations" },
    ]
  },
  {
    icon: "📐", color: "#e0f2fe", label: "Layout, Margins & Spacing",
    items: [
      { text: "Canvas size matches the required format for each target channel", note: "e.g. width/height for SM, width/height for newsletter" },
      { text: "Outer margins and padding match the spacing tokens from the design system" },
      { text: "No visual element bleeds into the safe zone or is clipped at the canvas edge" },
      { text: "Internal spacing between chart elements is consistent and balanced" },
      { text: "Legend is correctly positioned and aligned to the layout grid" },
      { text: "Footnotes is placed below the chart in the chart area" },
      { text: "Source is placed within the footer area" },
    ]
  },
  {
    icon: "📊", color: "#fce7f3", label: "Data Accuracy & Integrity",
    items: [
      { text: "All data values have been verified against the source dataset" },
      { text: "The chart type is appropriate for the story and the data structure" },
      { text: "Axes start at the correct baseline", note: "Bar charts must start at 0; deviations require explicit justification" },
      { text: "Scale, intervals, and axis breaks are consistent and not visually misleading" },
      { text: "Units are clearly stated on the chart (%, USD, millions, index base year, etc.)" },
      { text: "The reference time period or year is explicitly labeled" },/*
      { text: "Data source is cited in full with correct attribution wording" },*/
    ]
  },
  {
    icon: "✍️", color: "#dcfce7", label: "Titles, Labels & Annotations",
    items: [
      { text: "The title is self-explanatory without requiring surrounding editorial text" },
      { text: "The title communicates the key takeaway, not just the topic" },
      { text: "All data labels are visible and free of overlaps with each other or chart elements" },
      { text: "Annotations and callouts are accurate and clearly anchored to the correct data point" },
      { text: "Geographic names, entity names, and acronyms are spelled and capitalized correctly" },
      { text: "No placeholder text remains (Lorem ipsum, [TBC], TODO, etc.)" },
    ]
  },
  {
    icon: "♿", color: "#fff7ed", label: "Accessibility & Readability",
    items: [
      { text: "Text-to-background contrast meets WCAG AA standard", note: "Minimum ratio of 4.5:1 for normal text, 3:1 for large text" },
      { text: "Information is not conveyed by color alone", note: "Use patterns, direct labels, or shapes as a second encoding channel" },
      { text: "The chart remains legible at thumbnail size (mobile feed or email preview)" },
      { text: "An alt text or plain-language caption is drafted for the social media post" },
    ]
  },
  {
    icon: "💾", color: "#f3f4f6", label: "Export & File Quality",
    items: [
      /*{ text: "File is exported at the correct resolution for the channel", note: "≥ 2× (144 dpi) for digital screens; 300 dpi for print" },*/
      { text: "Export format is correct for the target channel", note: "PNG for all outputs" },
      { text: "File size is optimized without visible quality loss or compression artefacts" },
      { text: "The final file has been previewed in the actual target context", note: "e.g. feed simulator, mobile preview" },
      { text: "File name follows the team naming convention and includes a version number" },
    ]
  },
];

let state = {};
let total = 0;
const sectionsEl = document.getElementById('sections');

data.forEach((section, si) => {
  total += section.items.length;
  const sec = document.createElement('div');
  sec.className = 'section';

  const header = document.createElement('div');
  header.className = 'section-header' + (si === 0 ? ' open' : '');
  header.innerHTML = `
    <div class="section-icon" style="background:${section.color}">${section.icon}</div>
    <div class="section-title">${section.label}</div>
    <span class="section-count" id="cnt-${si}">0/${section.items.length}</span>
    <span class="chevron${si === 0 ? ' open' : ''}" id="chev-${si}">▶</span>
  `;

  const itemsDiv = document.createElement('div');
  itemsDiv.className = 'items' + (si === 0 ? ' open' : '');
  itemsDiv.id = `items-${si}`;

  section.items.forEach((item, ii) => {
    const key = `${si}-${ii}`;
    state[key] = false;
    const div = document.createElement('div');
    div.className = 'item';
    div.id = `itm-${key}`;
    div.innerHTML = `
      <div class="checkmark" id="cm-${key}"></div>
      <span class="item-text">${item.text}${item.note ? `<span class="item-note">ℹ︎ ${item.note}</span>` : ''}</span>
    `;
    div.onclick = () => toggle(key, si, section.items.length);
    itemsDiv.appendChild(div);
  });

  header.onclick = () => {
    const open = itemsDiv.classList.toggle('open');
    header.classList.toggle('open', open);
    document.getElementById(`chev-${si}`).classList.toggle('open', open);
  };

  sec.appendChild(header);
  sec.appendChild(itemsDiv);
  sectionsEl.appendChild(sec);
});

updateGlobal();

function toggle(key, si, slen) {
  state[key] = !state[key];
  document.getElementById(`itm-${key}`).classList.toggle('checked', state[key]);
  // section count
  let sc = 0;
  for (let i = 0; i < slen; i++) if (state[`${si}-${i}`]) sc++;
  document.getElementById(`cnt-${si}`).textContent = `${sc}/${slen}`;
  updateGlobal();
}

function updateGlobal() {
  const checked = Object.values(state).filter(Boolean).length;
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${checked} / ${total} items checked`;
  document.getElementById('doneBanner').classList.toggle('visible', checked === total && total > 0);
}

function resetAll() {
  Object.keys(state).forEach(k => { state[k] = false; });
  document.querySelectorAll('.item').forEach(el => el.classList.remove('checked'));
  data.forEach((s, si) => {
    document.getElementById(`cnt-${si}`).textContent = `0/${s.items.length}`;
  });
  updateGlobal();
}
</script>
</body>
</html>
